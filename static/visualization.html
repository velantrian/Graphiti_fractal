<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Memory - Knowledge Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #fff; }
        #container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        #header { padding: 20px; background: #2a2a2a; border-bottom: 1px solid #444; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .stats { font-size: 12px; color: #aaa; }
        #graph { flex: 1; background: #0a0a0a; }
        .node { fill: #32b8c6; stroke: #fff; stroke-width: 2px; }
        .node.person { fill: #ff6b6b; }
        .node.project { fill: #4ecdc4; }
        .node.concept { fill: #95e1d3; }
        .node:hover { stroke-width: 3px; filter: brightness(1.2); }
        .link { stroke: #666; stroke-width: 1px; }
        .label { font-size: 11px; pointer-events: none; text-anchor: middle; }
        .tooltip { position: absolute; background: #333; padding: 10px; border-radius: 4px; font-size: 12px; pointer-events: none; z-index: 1000; border: 1px solid #666; }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>🌀 Fractal Memory - Knowledge Graph</h1>
            <div class="stats"><span id="nodeCount">Nodes: 0</span> | <span id="edgeCount">Edges: 0</span></div>
        </div>
        <svg id="graph"></svg>
    </div>
    <div id="tooltip" class="tooltip" style="display:none"></div>
    <script>
    function setTooltipContent(tooltip, label, title) {
        // Graph labels/summaries are memory data, not trusted HTML. Build the
        // tooltip with text nodes so stored content cannot execute as markup.
        tooltip.replaceChildren();
        const strong = document.createElement('strong');
        strong.textContent = label || '';
        tooltip.appendChild(strong);
        tooltip.appendChild(document.createElement('br'));
        tooltip.appendChild(document.createTextNode(title || ''));
    }

    function showError(message) {
        const paragraph = document.createElement('p');
        paragraph.style.padding = '20px';
        paragraph.style.color = '#fca5a5';
        paragraph.textContent = message;
        document.getElementById('graph').insertAdjacentElement('afterend', paragraph);
    }

    async function loadAndVisualize() {
        let token = sessionStorage.getItem('fractalApiToken') || '';
        if (!token) {
            token = window.prompt('Enter FRACTAL_API_TOKEN for this visualization tab') || '';
            if (token) sessionStorage.setItem('fractalApiToken', token);
        }
        if (!token) throw new Error('API token is required to load graph data');
        const response = await fetch('/visualization/graph_data.json', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!response.ok) throw new Error(response.status === 401 ? 'Invalid API token' : 'Run: python main.py viz-export');
        const data = await response.json();
        document.getElementById('nodeCount').textContent = `Nodes: ${data.nodes.length}`;
        document.getElementById('edgeCount').textContent = `Edges: ${data.edges.length}`;
        const svg = d3.select('#graph');
        const width = window.innerWidth;
        const height = window.innerHeight - 80;
        const simulation = d3.forceSimulation(data.nodes)
            .force('link', d3.forceLink(data.edges).id(d => d.id).distance(100))
            .force('charge', d3.forceManyBody().strength(-300))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collide', d3.forceCollide().radius(d => d.size + 10));
        const link = svg.selectAll('.link').data(data.edges).enter().append('line').attr('class','link').attr('stroke-width',2);
        const node = svg.selectAll('.node').data(data.nodes).enter().append('circle')
            .attr('class', d => `node ${(d.type || '').toLowerCase()}`).attr('r', d => d.size).call(drag(simulation));
        const labels = svg.selectAll('.label').data(data.nodes).enter().append('text').attr('class','label').text(d => d.label);
        simulation.on('tick', () => {
            link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
            node.attr('cx',d=>d.x=Math.max(d.size,Math.min(width-d.size,d.x))).attr('cy',d=>d.y=Math.max(d.size,Math.min(height-d.size,d.y)));
            labels.attr('x',d=>d.x).attr('y',d=>d.y+d.size+15);
        });
        const tooltip=document.getElementById('tooltip');
        node.on('mouseover',function(event,d){tooltip.style.display='block';setTooltipContent(tooltip,d.label,d.title);tooltip.style.left=(event.pageX+10)+'px';tooltip.style.top=(event.pageY+10)+'px';})
            .on('mousemove',event=>{tooltip.style.left=(event.pageX+10)+'px';tooltip.style.top=(event.pageY+10)+'px';})
            .on('mouseout',()=>{tooltip.style.display='none';});
    }
    function drag(simulation){
        return d3.drag()
            .on('start',(event,d)=>{if(!event.active)simulation.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
            .on('drag',(event,d)=>{d.fx=event.x;d.fy=event.y;})
            .on('end',(event,d)=>{if(!event.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;});
    }
    loadAndVisualize().catch(err => showError(err.message));
    </script>
</body>
</html>
