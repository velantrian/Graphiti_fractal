services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4JLABS_PLUGINS=[]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fractal-app
    depends_on:
      neo4j:
        condition: service_healthy
    working_dir: /app
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      - FRACTAL_API_TOKEN=${FRACTAL_API_TOKEN:?Set FRACTAL_API_TOKEN in .env}
      - FRACTAL_USER_ID=${FRACTAL_USER_ID:-sergey}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - FRACTAL_ALLOW_HARD_DELETE=${FRACTAL_ALLOW_HARD_DELETE:-0}
      - FRACTAL_ALLOW_CLEAR_ALL=${FRACTAL_ALLOW_CLEAR_ALL:-0}
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
