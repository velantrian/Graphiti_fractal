name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-contracts:
    name: core-contracts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout exact validation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation target
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "expected $EXPECTED_SHA but checked out $ACTUAL_SHA"
            exit 2
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install reviewed dependency environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ci.txt -r requirements.txt
          python -m pip check

      - name: Compile active Python surface
        run: |
          python -m compileall -q \
            app.py main.py simple_chat_agent.py \
            api core eval experience knowledge layers mcp_server queries scripts

      - name: Verify automated test collection
        run: make PYTHON=python test-collect

      - name: Run always-on contracts
        run: make PYTHON=python test-contracts

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact validation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation target
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "expected $EXPECTED_SHA but checked out $ACTUAL_SHA"
            exit 2
          }

      - name: Build reviewed Docker image
        run: docker build --file Dockerfile --tag graphiti-fractal:ci .
