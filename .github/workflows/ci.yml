name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-contracts:
    name: core-contracts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout exact validation target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation target
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "expected $EXPECTED_SHA but checked out $ACTUAL_SHA"
            exit 2
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile active Python surface
        run: |
          python -m compileall -q \
            app.py main.py simple_chat_agent.py \
            api core eval experience knowledge layers mcp_server queries scripts

      - name: Run always-on contracts
        run: |
          python -m pytest -q \
            tests/test_mcp_smoke.py \
            tests/test_security_contract.py \
            tests/test_instance_contract.py \
            tests/test_model_policy.py \
            tests/test_runtime_dependency_policy.py \
            tests/test_memory_lifecycle.py \
            tests/test_memory_import.py \
            tests/test_recall_telemetry_wiring.py \
            tests/test_derived_graph.py \
            tests/test_graphrag_policy.py \
            tests/test_graphrag_memory_ops.py \
            tests/test_retrieval_eval.py \
            tests/test_provenance_contract.py \
            tests/test_provenance_migration.py \
            tests/test_dedupe_contract.py \
            tests/test_embedding_fail_closed.py \
            tests/test_buffer_clear_feature.py \
            tests/test_normalization.py \
            tests/test_entities.py \
            tests/test_experience_hash.py