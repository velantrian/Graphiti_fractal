name: Legacy Provenance Dry-Run (Opt-In)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEO4J_URI: ${{ secrets.FRACTAL_PROVENANCE_NEO4J_URI }}
      NEO4J_USER: ${{ secrets.FRACTAL_PROVENANCE_NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.FRACTAL_PROVENANCE_NEO4J_PASSWORD }}
    steps:
      - name: Require explicit legacy database secrets
        shell: bash
        run: |
          test -n "$NEO4J_URI" || { echo 'FRACTAL_PROVENANCE_NEO4J_URI secret is required'; exit 2; }
          test -n "$NEO4J_USER" || { echo 'FRACTAL_PROVENANCE_NEO4J_USER secret is required'; exit 2; }
          test -n "$NEO4J_PASSWORD" || { echo 'FRACTAL_PROVENANCE_NEO4J_PASSWORD secret is required'; exit 2; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install reviewed dependency environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ci.txt -r requirements.txt
          python -m pip check

      - name: Run provenance preview only
        run: |
          python scripts/provenance_migration.py | tee provenance-preview.json

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-preview
          path: provenance-preview.json
          if-no-files-found: error
          retention-days: 7
