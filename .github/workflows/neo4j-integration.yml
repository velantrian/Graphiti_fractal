name: Neo4j Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  neo4j-operational-contracts:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.29-community
        env:
          NEO4J_AUTH: neo4j/fractal-test-password
        ports:
          - 7687:7687
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fractal-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile integration surface
        run: |
          python -m compileall -q core tests/integration

      - name: Run provider-free live Neo4j contracts
        run: |
          python -m pytest -q tests/integration/test_neo4j_operational_contracts.py
