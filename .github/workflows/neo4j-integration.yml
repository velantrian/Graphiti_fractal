name: Neo4j Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  neo4j-operational-contracts:
    runs-on: ubuntu-latest
    # No service container and no NEO4J_* here: scripts/test_neo4j.py starts
    # disposable containers with random credentials and a per-run marker, the
    # same admission path as `make test-integration` on a developer machine.
    env:
      FRACTAL_TEST_NEO4J_IMAGE: neo4j:5.26.29-community
    steps:
      - name: Checkout exact validation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation target
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "expected $EXPECTED_SHA but checked out $ACTUAL_SHA"
            exit 2
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install reviewed dependency environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ci.txt -r requirements.txt
          python -m pip check

      - name: Compile integration surface
        run: |
          python -m compileall -q core tests/integration tests/isolation tests/support scripts/test_neo4j.py

      - name: Live Neo4j contracts on an admitted disposable database, then decoy rejection
        run: |
          python scripts/test_neo4j.py acceptance \
            --target tests/integration/test_neo4j_operational_contracts.py
