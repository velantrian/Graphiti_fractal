name: Neo4j Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  neo4j-operational-contracts:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.29-community
        env:
          NEO4J_AUTH: neo4j/fractal-test-password
        ports:
          - 7687:7687
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fractal-test-password
    steps:
      - name: Checkout exact validation target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact validation target
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "expected $EXPECTED_SHA but checked out $ACTUAL_SHA"
            exit 2
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install reviewed dependency environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ci.txt -r requirements.txt
          python -m pip check

      - name: Compile integration surface
        run: |
          python -m compileall -q core tests/integration

      - name: Run provider-free live Neo4j contracts
        run: |
          python -m pytest -q tests/integration/test_neo4j_operational_contracts.py
