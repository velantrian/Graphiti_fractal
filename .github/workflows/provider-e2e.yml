name: Provider E2E (Opt-In)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No service container and no NEO4J_*: scripts/test_neo4j.py starts a disposable
    # database with random credentials and a per-run marker, and the test verifies that
    # marker on the connection Graphiti then uses, before schema setup or any write.
    env:
      FRACTAL_TEST_NEO4J_IMAGE: neo4j:5.26.29-community
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FRACTAL_REQUIRE_PROVIDER_E2E: "1"
      FRACTAL_USER_ID: e2e-owner
      FRACTAL_MEMORY_RECALL: always
    steps:
      - name: Require explicit provider secret
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY secret is required for this opt-in workflow'; exit 2; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install reviewed dependency environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ci.txt -r requirements.txt
          python -m pip check

      - name: Run bounded provider-backed E2E on an admitted disposable database
        run: |
          python scripts/test_neo4j.py run -- \
            python -m pytest -q -rs tests/e2e/test_provider_backed_memory_e2e.py
