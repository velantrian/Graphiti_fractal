name: External Validation Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  provider-e2e:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26.29-community
        env:
          NEO4J_AUTH: neo4j/fractal-e2e-password
        ports:
          - 7687:7687
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fractal-e2e-password
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FRACTAL_USER_ID: e2e-owner
      FRACTAL_MEMORY_RECALL: always
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head and external-gate marker
        id: gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "expected $EXPECTED_SHA but checked out $ACTUAL_SHA"
            exit 2
          }
          if git log -1 --pretty=%B | grep -Fq '[external-gate]'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'External gate marker present.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIPPED_NO_EXTERNAL_GATE_MARKER' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Probe provider secret
        if: steps.gate.outputs.enabled == 'true'
        id: provider-secret
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'OPENAI_API_KEY: AVAILABLE' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Provider E2E: BLOCKED_MISSING_OPENAI_API_KEY' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true' && steps.provider-secret.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true' && steps.provider-secret.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run bounded provider-backed E2E
        if: steps.gate.outputs.enabled == 'true' && steps.provider-secret.outputs.available == 'true'
        run: python -m pytest -q tests/e2e/test_provider_backed_memory_e2e.py

      - name: Provider acceptance summary
        if: always() && steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ "${{ steps.provider-secret.outputs.available }}" != 'true' ]; then
            echo 'Provider gate verdict: BLOCKED_MISSING_SECRET' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = 'success' ]; then
            echo 'Provider gate verdict: PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Provider gate verdict: FAIL' >> "$GITHUB_STEP_SUMMARY"
          fi

  provenance-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEO4J_URI: ${{ secrets.FRACTAL_PROVENANCE_NEO4J_URI }}
      NEO4J_USER: ${{ secrets.FRACTAL_PROVENANCE_NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.FRACTAL_PROVENANCE_NEO4J_PASSWORD }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head and external-gate marker
        id: gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "expected $EXPECTED_SHA but checked out $ACTUAL_SHA"
            exit 2
          }
          if git log -1 --pretty=%B | grep -Fq '[external-gate]'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SKIPPED_NO_EXTERNAL_GATE_MARKER' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Probe legacy Neo4j secrets
        if: steps.gate.outputs.enabled == 'true'
        id: legacy-secrets
        shell: bash
        run: |
          if [ -n "$NEO4J_URI" ] && [ -n "$NEO4J_USER" ] && [ -n "$NEO4J_PASSWORD" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Legacy Neo4j credentials: AVAILABLE' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Provenance gate: BLOCKED_MISSING_LEGACY_NEO4J_SECRETS' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true' && steps.legacy-secrets.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true' && steps.legacy-secrets.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run provenance DRY_RUN only
        if: steps.gate.outputs.enabled == 'true' && steps.legacy-secrets.outputs.available == 'true'
        run: python scripts/provenance_migration.py | tee provenance-preview.json

      - name: Upload provenance preview
        if: steps.gate.outputs.enabled == 'true' && steps.legacy-secrets.outputs.available == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: provenance-preview-${{ github.event.pull_request.head.sha }}
          path: provenance-preview.json
          if-no-files-found: error
          retention-days: 7

      - name: Provenance acceptance summary
        if: always() && steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ "${{ steps.legacy-secrets.outputs.available }}" != 'true' ]; then
            echo 'Provenance gate verdict: BLOCKED_MISSING_SECRET' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = 'success' ]; then
            echo 'Provenance gate verdict: PASS (DRY_RUN only)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Provenance gate verdict: FAIL' >> "$GITHUB_STEP_SUMMARY"
          fi
